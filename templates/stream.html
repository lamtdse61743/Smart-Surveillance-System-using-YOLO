<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Surveillance Live Stream</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      margin: auto;
      position: relative;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 20px;
      background: black;
    }
    .upload-form {
      margin-top: 40px;
    }
    .badge {
      position: absolute;
      top: 35px;
      left: 25px;
      background: red;
      color: white;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .info-bar {
      margin-top: 10px;
      background: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }
    .info-bar span {
      display: inline-block;
      margin-right: 20px;
    }
    #loadingContainer {
      display: flex;
      justify-content: center;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h4 class="center-align">📹 Live Camera Simulator</h4>

    <div id="loadingContainer">
      <div class="preloader-wrapper big active" id="spinner">
        <div class="spinner-layer spinner-blue-only">
          <div class="circle-clipper left"><div class="circle"></div></div>
          <div class="gap-patch"><div class="circle"></div></div>
          <div class="circle-clipper right"><div class="circle"></div></div>
        </div>
      </div>
    </div>

    <div class="badge" id="liveBadge" style="display:none;">🔴 LIVE</div>
    <video id="liveVideo" controls muted style="display:none;"></video>

    <div class="info-bar" id="infoBar" style="display:none;">
      <span id="uptime">⏱ Uptime: 0s</span>
      <span id="latency">📶 Delay: 0s</span>
      <span id="segment">📄 Segment: -</span>
    </div>

    <form id="uploadForm" class="upload-form">
      <div class="file-field input-field">
        <div class="btn">
          <span>Upload Stream</span>
          <input type="file" id="videoInput" accept="video/mp4,video/x-m4v,video/*" required>
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text" placeholder="Upload a video to simulate livestream">
        </div>
      </div>
      <button class="btn waves-effect waves-light" type="submit">Start Stream</button>
      <button class="btn waves-effect waves-light red" type="button" id="stopStreamBtn" style="display:none;">Stop Stream</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const video = document.getElementById('liveVideo');
    const videoSrc = '/static/output/hls/stream.m3u8';
    const uptimeSpan = document.getElementById('uptime');
    const latencySpan = document.getElementById('latency');
    const segmentSpan = document.getElementById('segment');
    const spinner = document.getElementById('spinner');
    const infoBar = document.getElementById('infoBar');
    const liveBadge = document.getElementById('liveBadge');
    const uploadForm = document.getElementById('uploadForm');
    const stopStreamBtn = document.getElementById('stopStreamBtn');
    let startTime = Date.now();
    let hls;

    setInterval(() => {
      const seconds = Math.floor((Date.now() - startTime) / 1000);
      uptimeSpan.textContent = `⏱ Uptime: ${seconds}s`;
    }, 1000);

    function waitForSegments(minCount = 2) {
      return new Promise(resolve => {
        const check = () => {
          fetch('/static/output/hls/stream.m3u8', { cache: 'no-store' })
            .then(res => res.ok ? res.text() : "")
            .then(data => {
              const matches = data.match(/stream\d+\.ts/g);
              if (matches && matches.length >= minCount) {
                setTimeout(resolve, 1000); // buffer time
              } else {
                setTimeout(check, 1000);
              }
            })
            .catch(() => setTimeout(check, 1000));
        };
        check();
      });
    }

    function checkStreamStatus() {
      console.log('Checking stream status...');
      fetch('/stream-status')
        .then(response => response.json())
        .then(data => {
          if (data.live) {
            waitForSegments(2).then(() => {
              console.log("Enough segments available. Initializing stream...");
              initStream();
            });
          } else {
            setTimeout(checkStreamStatus, 1000);
          }
        })
        .catch(err => {
          console.error('Stream status error:', err);
          M.toast({ html: '❌ Error checking stream status', classes: 'red' });
          setTimeout(checkStreamStatus, 1000);
        });
    }

    function initStream() {
      console.log('Initializing stream...');
      spinner.style.display = 'none';
      video.style.display = 'block';
      infoBar.style.display = 'block';
      liveBadge.style.display = 'block';
      stopStreamBtn.style.display = 'inline-block';

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90,
          liveSyncDurationCount: 3,
          maxBufferLength: 30,
          maxMaxBufferLength: 60
        });

        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          console.log('HLS manifest parsed, attempting playback...');
          attemptPlayback(0);
        });
        hls.on(Hls.Events.LEVEL_UPDATED, (_, data) => {
          segmentSpan.textContent = `📄 Segment: ${data.details.fragments.length} segments`;
        });
        hls.on(Hls.Events.FRAG_LOADED, (_, data) => {
          const latency = hls.latency || (hls.liveSyncPosition - video.currentTime);
          latencySpan.textContent = `📶 Delay: ${latency.toFixed(1)}s`;
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error('HLS.js error:', data);
          M.toast({ html: `❌ Stream error: ${data.type} - ${data.details}`, classes: 'red' });
          if (data.fatal) {
            setTimeout(checkStreamStatus, 1000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        attemptPlayback(0);
        updateSegmentCount();
      } else {
        M.toast({ html: '❌ HLS not supported by your browser', classes: 'red' });
        spinner.style.display = 'none';
      }
    }

    function attemptPlayback(attempt) {
      const maxAttempts = 3;
      if (attempt >= maxAttempts) {
        M.toast({ html: '❌ Failed to start playback after multiple attempts', classes: 'red' });
        return;
      }
      video.play().then(() => {
        console.log('Playback started');
      }).catch(e => {
        console.error(`Playback attempt ${attempt + 1} failed:`, e);
        if (e.name === 'AbortError') {
          setTimeout(() => attemptPlayback(attempt + 1), 1000);
        } else {
          M.toast({ html: `❌ Playback failed: ${e.message}`, classes: 'red' });
        }
      });
    }

    function updateSegmentCount() {
      fetch(videoSrc, { cache: 'no-store' })
        .then(response => response.text())
        .then(data => {
          const segments = data.match(/stream\d+\.ts/g);
          const count = segments ? segments.length : 0;
          segmentSpan.textContent = `📄 Segment: ${count} segments`;
          if (liveBadge.style.display === 'block') {
            setTimeout(updateSegmentCount, 1000);
          }
        })
        .catch(err => {
          segmentSpan.textContent = '📄 Segment: 0';
          setTimeout(updateSegmentCount, 1000);
        });
    }

    const socket = io();
    socket.on('connect', () => console.log('Connected to WebSocket'));
    socket.on('stream_stopped', () => {
      video.style.display = 'none';
      infoBar.style.display = 'none';
      liveBadge.style.display = 'none';
      stopStreamBtn.style.display = 'none';
      if (hls) hls.destroy();
      video.src = '';
      M.toast({ html: '🛑 Stream stopped', classes: 'green' });
    });

    uploadForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const input = document.getElementById('videoInput');
      const file = input.files[0];
      if (!file) {
        M.toast({ html: '❌ No video selected', classes: 'red' });
        return;
      }

      const formData = new FormData();
      formData.append('video', file);

      fetch('/upload-stream', {
        method: 'POST',
        body: formData
      }).then(res => res.json())
        .then(data => {
          if (data.success) {
            M.toast({ html: '🎥 Video uploaded. Starting stream...', classes: 'green' });
            checkStreamStatus();
          } else {
            M.toast({ html: `❌ ${data.message || 'Failed to upload video'}`, classes: 'red' });
          }
        })
        .catch(err => {
          M.toast({ html: '❌ Upload error occurred', classes: 'red' });
        });
    });

    stopStreamBtn.addEventListener('click', () => {
      fetch('/stop-stream', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            M.toast({ html: '🛑 Stream stopped', classes: 'green' });
          } else {
            M.toast({ html: '❌ Failed to stop stream', classes: 'red' });
          }
        })
        .catch(err => {
          M.toast({ html: '❌ Stop stream error occurred', classes: 'red' });
        });
    });

    checkStreamStatus();
  </script>
</body>
</html>
