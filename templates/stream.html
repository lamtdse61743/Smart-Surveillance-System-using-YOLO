<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Surveillance Live Stream</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      margin: auto;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 20px;
      background: black;
    }
    .upload-form {
      margin-top: 40px;
    }
    .live-badge {
      position: absolute;
      top: 40px;
      left: 30px;
      background: red;
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

  </style>
</head>
<body>
  <div class="container">
    <h4 class="center-align">Live Camera Simulator</h4>

    <video id="liveVideo" autoplay muted></video>
    <div class="live-badge">🔴 LIVE</div>

    <form id="uploadForm" class="upload-form">
      <div class="file-field input-field">
        <div class="btn">
          <span>Upload Stream</span>
          <input type="file" id="videoInput" accept="video/mp4,video/x-m4v,video/*" required>
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text" placeholder="Upload a video to simulate livestream">
        </div>
      </div>
      <button class="btn waves-effect waves-light" type="submit">Start Stream</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    const video = document.getElementById('liveVideo');
    const videoSrc = '/static/output/hls/stream.m3u8';
    video.controls = false;

    async function waitForManifest() {
      let attempts = 0;
      while (attempts < 20) {
        const res = await fetch(videoSrc, { method: 'HEAD' });
        if (res.ok) return true;
        await new Promise(r => setTimeout(r, 500));
        attempts++;
      }
      return false;
    }

    async function initStream() {
      const exists = await waitForManifest();
      if (!exists) {
        M.toast({ html: "❌ Stream not ready", classes: "red" });
        return;
      }

      if (Hls.isSupported()) {
        const hls = new Hls({
          maxLiveSyncPlaybackRate: 1.1,
          liveSyncDuration: 3,
          enableWorker: true,
          lowLatencyMode: true
        });

        hls.loadSource(videoSrc);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play();
        });

        hls.on(Hls.Events.FRAG_LOADED, () => {
          const liveLatency = hls.latency;
          if (liveLatency > 5) {
            video.currentTime = hls.liveSyncPosition;
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.play();
      }
    }

    initStream();

    // Upload and start stream
    const uploadForm = document.getElementById('uploadForm');
    uploadForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const input = document.getElementById('videoInput');
      const file = input.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('video', file);

      fetch('/upload-stream', {
        method: 'POST',
        body: formData
      }).then(res => {
        if (res.ok) {
          M.toast({ html: "🎥 Video uploaded. Reloading stream...", classes: "green" });
          setTimeout(() => window.location.reload(), 2000);
        } else {
          M.toast({ html: "❌ Failed to upload video", classes: "red" });
        }
      });
    });
  </script>
</body>
</html>
