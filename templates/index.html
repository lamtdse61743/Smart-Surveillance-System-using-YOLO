<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Surveillance Video Processor</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">


  <style>
    
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    video {
      margin-top: 20px;
      width: 100%;
      max-width: 720px;
      border: 1px solid #ccc;
    }
    #progress-container {
      display: none;
      margin-top: 20px;
    }
    #output-section {
      display: none;
      margin-top: 30px;
    }
    #log-section {
      display: none;
      margin-top: 30px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
    #filter-container {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Smart Surveillance Processor</h1>
  <p>Upload a video to detect faces, track objects, and generate logs.</p>

  <form id="upload-form" enctype="multipart/form-data">
    <input type="file" name="video" accept="video/*" required />
    <button type="submit">Upload & Process</button>
  </form>

  <div id="progress-container">
    <h3>Processing Video...</h3>
    <div id="progress-bar" style="width: 100%; background: #ddd; height: 25px;">
      <div id="progress-fill" style="width: 0%; background: #4caf50; height: 100%; text-align: center; color: white;">
        0%
      </div>
    </div>
  </div>

  <div id="output-section">
    <h2>Processed Output</h2>
    <video id="output-video" controls></video>
    <br />
    <a id="download-link" href="#" download>Download Output Video</a>
  </div>

  <div id="log-section">
    <h2>Event Log</h2>
    <div id="filter-container">
      <label for="behavior-filter">Filter by Behavior:</label>
      <select id="behavior-filter">
        <option value="All">All</option>
      </select>
      <button id="download-csv">Download CSV</button>
    </div>
    <table id="log-table"></table>
  </div>

  <script>
    const form = document.getElementById("upload-form");
    const fill = document.getElementById("progress-fill");
    const progressContainer = document.getElementById("progress-container");
    const outputSection = document.getElementById("output-section");
    const outputVideo = document.getElementById("output-video");
    const downloadLink = document.getElementById("download-link");
    const logSection = document.getElementById("log-section");
    const logTable = document.getElementById("log-table");
    const filterSelect = document.getElementById("behavior-filter");
    const downloadCSV = document.getElementById("download-csv");

    let logData = [];

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      progressContainer.style.display = "block";
      outputSection.style.display = "none";
      logSection.style.display = "none";
      fill.style.width = "0%";
      fill.textContent = "0%";

      let pollProgress = setInterval(() => {
        fetch("/progress")
          .then(res => res.text())
          .then(percent => {
            fill.style.width = percent + "%";
            fill.textContent = percent + "%";
          });
      }, 500);

      fetch("/", {
        method: "POST",
        body: formData,
      })
      .then(res => res.json())
      .then(data => {
        clearInterval(pollProgress);

        if (data.output_video) {
          const videoPath = "/static/output/" + data.output_video;
          const checkVideoExists = () => {
            fetch(videoPath, { method: "HEAD" }).then((res) => {
              if (res.ok) {
                outputVideo.src = videoPath;
                downloadLink.href = videoPath;
                outputSection.style.display = "block";

                // Load and render log
                logData = data.log_data;
                populateLogTable("All");
                populateFilterOptions();
                logSection.style.display = "block";

              } else {
                setTimeout(checkVideoExists, 500);
              }
            });
          };
          checkVideoExists();
        } else {
          alert("Processing failed.");
        }
      })
      .catch((err) => {
        clearInterval(pollProgress);
        alert("An error occurred: " + err.message);
      });
    });

    function populateLogTable(filterValue) {
      logTable.innerHTML = "";
      if (logData.length === 0) return;

      const headers = logData[0];
      const filtered = logData.slice(1).filter(row => {
        return filterValue === "All" || row[2] === filterValue;
      });

      let html = "<thead><tr>";
      for (const col of headers) {
        html += `<th>${col}</th>`;
      }
      html += "</tr></thead><tbody>";
      for (const row of filtered) {
        html += "<tr>";
        for (const cell of row) {
          html += `<td>${cell}</td>`;
        }
        html += "</tr>";
      }
      html += "</tbody>";
      logTable.innerHTML = html;
    }

    function populateFilterOptions() {
      const behaviors = new Set(logData.map(row => row[2]).slice(1));
      filterSelect.innerHTML = `<option value="All">All</option>`;
      behaviors.forEach(behavior => {
        filterSelect.innerHTML += `<option value="${behavior}">${behavior}</option>`;
      });
    }

    filterSelect.addEventListener("change", () => {
      populateLogTable(filterSelect.value);
    });

    downloadCSV.addEventListener("click", () => {
      let csvContent = "data:text/csv;charset=utf-8,";
      logData.forEach(row => {
        csvContent += row.join(",") + "\r\n";
      });
      const encodedUri = encodeURI(csvContent);
      const tempLink = document.createElement("a");
      tempLink.setAttribute("href", encodedUri);
      tempLink.setAttribute("download", "log.csv");
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
    });
  </script>

</body>
</html>
