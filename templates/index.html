<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Surveillance Video Processor</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      background: #f9f9f9;
    }
    .container {
      margin-top: 40px;
    }
    video {
      width: 100%;
      max-height: 480px;
      border-radius: 6px;
      background: black;
    }
    #progress-container {
      display: none;
      margin-top: 30px;
    }
    #output-section, #log-section {
      display: none;
      margin-top: 40px;
    }
    .log-controls {
      margin-bottom: 20px;
    }
    table {
      font-size: 0.9rem;
    }
    th, td {
      padding: 8px 12px !important;
    }
    #user-greeting {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="user-greeting"></div>

    <!-- Live Stream Section -->
    <div id="live-stream-section" class="card-panel" style="display: none;">
      <h5>🔴 Live Stream In Progress</h5>
      <video id="live-embed" controls autoplay muted></video>
      <div style="margin-top: 10px;">
        <a href="/stream" class="btn grey">Open Full Stream Page</a>
      </div>
    </div>

    <div class="center-align" style="margin-top: 10px;">
      <a href="/stream" class="btn grey">
        📹 Simulate CCTV Stream
      </a>
    </div>

    <h4 class="center-align">Smart Surveillance Processor</h4>
    <p class="center-align">Upload a video to detect people, faces, and behaviors. View logs and filter events below.</p>

    <form id="upload-form" enctype="multipart/form-data" class="card-panel">
      <div class="file-field input-field">
        <div class="btn">
          <span>Choose Video</span>
          <input type="file" name="video" accept="video/*" required />
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text" placeholder="Upload your surveillance video" />
        </div>
      </div>
      <button type="submit" class="btn waves-effect waves-light">Upload & Process</button>
    </form>

    <div id="progress-container">
      <h6>Processing Video...</h6>
      <div class="progress">
        <div id="progress-fill" class="determinate" style="width: 0%"></div>
      </div>
    </div>

    <div id="output-section" class="card-panel">
      <h5>Processed Output</h5>
      <video id="output-video" controls></video>
      <br><br>
      <a id="download-link" class="btn blue" href="#" download>Download Output Video</a>
    </div>

    <div id="log-section" class="card-panel">
      <h5>Event Log</h5>
      <div class="row log-controls">
        <div class="input-field col s6">
          <select id="behavior-filter">
            <option value="All" selected>All</option>
          </select>
          <label>Filter by Behavior</label>
        </div>
        <div class="col s6 right-align">
          <a class="btn green" id="download-csv">Download CSV</a>
        </div>
      </div>
      <table class="striped responsive-table" id="log-table"></table>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      M.AutoInit();

      const params = new URLSearchParams(window.location.search);
      const name = params.get("name");
      if (name) {
        document.getElementById("user-greeting").innerHTML = `👋 Welcome back, <strong>${name}</strong>!`;
      }

      const socket = io();
      socket.on("connect", () => {
        console.log("Connected to WebSocket");
      });

      socket.on("log_update", (data) => {
        if (logData.length === 0) {
          logData.push(data.row); // Assume first row is headers if empty
        }
        logData.push(data.row);
        populateLogTable(filterSelect.value);
        populateFilterOptions();
        logSection.style.display = "block";
      });

      socket.on("stream_stopped", () => {
        document.getElementById("live-stream-section").style.display = "none";
        M.toast({ html: "🛑 Live stream stopped", classes: "green" });
      });

      checkLiveStream();
      setInterval(checkLiveStream, 5000); // Refresh status every 5s
    });

    function checkLiveStream() {
      fetch("/stream-status")
        .then(res => res.json())
        .then(data => {
          const section = document.getElementById("live-stream-section");
          if (data.live) {
            section.style.display = "block";
            setupLiveVideo();
          } else {
            section.style.display = "none";
          }
        });
    }

    function setupLiveVideo() {
      const video = document.getElementById("live-embed");
      const source = "/static/output/hls/stream.m3u8";

      if (video.hasAttribute("data-loaded")) return; // prevent re-loading

      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 300 // 5-minute history
        });

        hls.loadSource(source);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.setAttribute("data-loaded", "true");
          video.play();
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error("HLS.js error", data);
          M.toast({ html: "❌ Stream error occurred", classes: "red" });
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = source;
        video.play();
      }
    }

    // Upload video logic
    const form = document.getElementById("upload-form");
    const fill = document.getElementById("progress-fill");
    const progressContainer = document.getElementById("progress-container");
    const outputSection = document.getElementById("output-section");
    const outputVideo = document.getElementById("output-video");
    const downloadLink = document.getElementById("download-link");
    const logSection = document.getElementById("log-section");
    const logTable = document.getElementById("log-table");
    const filterSelect = document.getElementById("behavior-filter");
    const downloadCSV = document.getElementById("download-csv");

    let logData = [];

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      progressContainer.style.display = "block";
      outputSection.style.display = "none";
      logSection.style.display = "none";
      fill.style.width = "0%";

      const pollProgress = setInterval(() => {
        fetch("/progress")
          .then(res => res.text())
          .then(percent => {
            fill.style.width = percent + "%";
          });
      }, 500);

      fetch("/upload", {
        method: "POST",
        body: formData,
      })
      .then(res => res.json())
      .then(data => {
        clearInterval(pollProgress);
        progressContainer.style.display = "none";

        if (data.output_video) {
          const videoPath = "/static/output/" + data.output_video;
          const checkVideoExists = () => {
            fetch(videoPath, { method: "HEAD" }).then(res => {
              if (res.ok) {
                outputVideo.src = videoPath;
                downloadLink.href = videoPath;
                outputSection.style.display = "block";

                logData = data.log_data;
                populateLogTable("All");
                populateFilterOptions();
                logSection.style.display = "block";
              } else {
                setTimeout(checkVideoExists, 500);
              }
            });
          };
          checkVideoExists();
        } else {
          M.toast({ html: "❌ Processing failed", classes: "red" });
        }
      })
      .catch(err => {
        clearInterval(pollProgress);
        progressContainer.style.display = "none";
        M.toast({ html: "❌ An error occurred: " + err.message, classes: "red" });
      });
    });

    function populateLogTable(filterValue) {
      logTable.innerHTML = "";
      if (logData.length === 0) return;

      const headers = logData[0];
      const behaviorIndex = headers.indexOf("Behavior");

      const filtered = logData.slice(1).filter(row =>
        filterValue === "All" || row[behaviorIndex] === filterValue
      );

      let html = "<thead><tr>";
      for (const col of headers) {
        html += `<th>${col}</th>`;
      }
      html += "</tr></thead><tbody>";
      for (const row of filtered) {
        html += "<tr>";
        for (const cell of row) {
          html += `<td>${cell}</td>`;
        }
        html += "</tr>";
      }
      html += "</tbody>";
      logTable.innerHTML = html;
    }

    function populateFilterOptions() {
      const headers = logData[0];
      const behaviorIndex = headers.indexOf("Behavior");
      const behaviors = new Set(logData.slice(1).map(row => row[behaviorIndex]));

      const currentValue = filterSelect.value;
      while (filterSelect.options.length > 0) {
        filterSelect.remove(0);
      }

      const allOption = document.createElement("option");
      allOption.value = "All";
      allOption.textContent = "All";
      filterSelect.appendChild(allOption);

      behaviors.forEach(behavior => {
        const opt = document.createElement("option");
        opt.value = behavior;
        opt.textContent = behavior;
        filterSelect.appendChild(opt);
      });

      const instance = M.FormSelect.getInstance(filterSelect);
      if (instance) instance.destroy();
      M.FormSelect.init(filterSelect);

      filterSelect.value = currentValue;
    }

    filterSelect.addEventListener("change", () => {
      populateLogTable(filterSelect.value);
    });

    downloadCSV.addEventListener("click", () => {
      let csvContent = "data:text/csv;charset=utf-8,";
      logData.forEach(row => {
        csvContent += row.join(",") + "\r\n";
      });
      const encodedUri = encodeURI(csvContent);
      const tempLink = document.createElement("a");
      tempLink.setAttribute("href", encodedUri);
      tempLink.setAttribute("download", "log.csv");
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
    });
  </script>
</body>
</html>
